plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            exclude '**/output_src/**'
        }
        resources { srcDirs = ['src/main/resources'] }
    }
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    accessWidenerPath = file("src/main/resources/cloth-config.accessWidener")
    mods {
        "cloth-config" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    // Gson for standalone injection mode (Minecraft provides it when running as a mod)
    implementation "com.google.code.gson:gson:2.10.1"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'dragonite.nativeBridgeTest',
            System.getProperty('dragonite.nativeBridgeTest', 'false')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def legitJar = file("${rootDir.parentFile}/vinflower (cloth config)/cloth-config-15.0.140-fabric.jar")
if (!legitJar.exists()) {
    legitJar = [rootDir.parentFile, rootDir].collectMany { dir ->
        (dir?.listFiles() ?: []).findAll { it.name.endsWith('.jar') && it.name.toLowerCase().contains('cloth') }
    }.find { it.exists() } ?: file("nonexistent")
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes(
            'Main-Class'                  : 'me.shedaniel.clothconfig2.injection.DragoniteLoader',
            'Premain-Class'               : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Agent-Class'                 : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Can-Retransform-Classes'     : 'true',
            'Can-Redefine-Classes'        : 'true',
            'Can-Set-Native-Method-Prefix': 'false'
        )
    }

    // 1. Our classes go FIRST - they take priority
    from(sourceSets.main.output)
    // Bundle Gson for standalone injection mode
    from({
        configurations.runtimeClasspath.filter { it.name.startsWith('gson') }.collect { zipTree(it) }
    }) {
        exclude 'META-INF/**'
    }
    // Map refmap to the deep location
    eachFile { FileCopyDetails details ->
        if (details.path == "cloth-config-refmap.json") {
            details.path = "META-INF/mixins/cloth-config-refmap.json"
        }
    }
    // 2. Legit files go SECOND - adds only what we don't have
    if (legitJar.exists()) {
        from(zipTree(legitJar)) {
            include '**/*.class'
            include 'assets/**'
            include 'LICENSE.md'
            exclude 'cloth-config.accessWidener'
            include 'META-INF/jars/**'
            include 'META-INF/maven/**'
            // EXCLUDE: Our custom implementations replace root impl classes but we need subpackages.
            // Since duplicatesStrategy is EXCLUDE, custom implementations take priority anyway.
        }
    }
    from("src/LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

remapJar {
    manifest {
        attributes(
            'Main-Class'                  : 'me.shedaniel.clothconfig2.injection.Main',
            'Premain-Class'               : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Agent-Class'                 : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Can-Retransform-Classes'     : 'true',
            'Can-Redefine-Classes'        : 'true',
            'Can-Set-Native-Method-Prefix': 'false'
        )
    }
}

def skipBuiltinProtection = providers.gradleProperty("skipBuiltinProtection")
        .map { it.toBoolean() }
        .orElse(false)
        .get()

// This legacy task encrypts with a build-only development key while the runtime
// derives an unrelated ECDH key. Keep it out of every release until that contract
// has an authenticated end-to-end test.
def enableExperimentalClassEncryption = providers.gradleProperty("enableExperimentalClassEncryption")
        .map { it.toBoolean() }
        .orElse(false)
        .get()

task obfuscateStrings {
    doLast {
        def srcDir = file("src/main/java")
        def destDir = file("build/obfuscatedSrc")
        
        if (destDir.exists()) {
            destDir.deleteDir()
        }
        destDir.mkdirs()
        
        copy {
            from srcDir
            into destDir
        }
        
        def formatByteArray = { byte[] arr ->
            StringBuilder sb = new StringBuilder()
            sb.append("new byte[]{")
            for (int i = 0; i < arr.length; i++) {
                if (i > 0) sb.append(",")
                sb.append((int) arr[i])
            }
            sb.append("}")
            return sb.toString()
        }
        
        fileTree(destDir).each { File file ->
            if (file.name.endsWith(".java")) {
                def random = new java.security.SecureRandom()
                def list = (0..255).toList()
                Collections.shuffle(list, random)
                byte[] sBox = new byte[256]
                for (int i = 0; i < 256; i++) {
                    sBox[i] = (byte) list.get(i)
                }
                int xorKey = random.nextInt(254) + 1
                int bitRotation = random.nextInt(7) + 1
                
                def sBoxStr = formatByteArray(sBox)
                
                def rotateRight = { int val, int count ->
                    int shift = count % 8
                    if (shift == 0) return val & 0xFF
                    return ((val >>> shift) | (val << (8 - shift))) & 0xFF
                }
                
                def encrypt = { String str ->
                    byte[] utf8 = str.getBytes("UTF-8")
                    byte[] encrypted = new byte[utf8.length]
                    for (int i = 0; i < utf8.length; i++) {
                        int b = utf8[i] & 0xFF
                        int xored = b ^ xorKey
                        int rotated = rotateRight(xored, bitRotation)
                        encrypted[i] = sBox[rotated]
                    }
                    return formatByteArray(encrypted)
                }
                
                def content = file.getText("UTF-8")
                
                // 1. Automatically wrap the first string argument of super("Name", ...) constructors
                def superPattern = java.util.regex.Pattern.compile("\\bsuper\\s*\\(\\s*\"([^\"\\\\]*(?:\\\\.[^\"\\\\]*)*)\"\\s*,")
                def superMatcher = superPattern.matcher(content)
                def superModified = false
                def superSb = new StringBuffer()
                while (superMatcher.find()) {
                    superModified = true
                    def plainText = superMatcher.group(1)
                    def replacement = "super(new SecString(\"${plainText}\"),"
                    superMatcher.appendReplacement(superSb, java.util.regex.Matcher.quoteReplacement(replacement))
                }
                if (superModified) {
                    superMatcher.appendTail(superSb)
                    content = superSb.toString()
                }

                // 2. Perform the macro replacement to encrypt all OBF("...") calls
                def pattern = java.util.regex.Pattern.compile("\\b(?:me\\.shedaniel\\.clothconfig2\\.impl\\.SecString\\.|SecString\\.)?OBF\\s*\\(\\s*\"([^\"\\\\]*(?:\\\\.[^\"\\\\]*)*)\"\\s*\\)")
                def matcher = pattern.matcher(content)
                def modified = false
                def sb = new StringBuffer()
                while (matcher.find()) {
                    modified = true
                    def plainText = matcher.group(1)
                    def unescaped = plainText.replace("\\\"", "\"").replace("\\\\", "\\").replace("\\n", "\n").replace("\\r", "\r").replace("\\t", "\t")
                    def encStr = encrypt(unescaped)
                    def replacement = "me.shedaniel.clothconfig2.impl.ConfigCategoryImpl.SecString.decryptToString(${encStr}, ${sBoxStr}, ${xorKey}, ${bitRotation})"
                    matcher.appendReplacement(sb, java.util.regex.Matcher.quoteReplacement(replacement))
                }
                if (modified) {
                    matcher.appendTail(sb)
                    content = sb.toString()
                }

                // 3. Perform replacement for new SecString("...") calls
                def newSecPattern = java.util.regex.Pattern.compile("new\\s+(?:me\\.shedaniel\\.clothconfig2\\.impl\\.)?SecString\\s*\\(\\s*\"([^\"\\\\]*(?:\\\\.[^\"\\\\]*)*)\"\\s*\\)")
                def newSecMatcher = newSecPattern.matcher(content)
                def newSecModified = false
                def newSecSb = new StringBuffer()
                while (newSecMatcher.find()) {
                    newSecModified = true
                    def plainText = newSecMatcher.group(1)
                    def unescaped = plainText.replace("\\\"", "\"").replace("\\\\", "\\").replace("\\n", "\n").replace("\\r", "\r").replace("\\t", "\t")
                    def encStr = encrypt(unescaped)
                    def replacement = "new me.shedaniel.clothconfig2.impl.ConfigCategoryImpl.SecString(${encStr}, ${sBoxStr}, ${xorKey}, ${bitRotation})"
                    newSecMatcher.appendReplacement(newSecSb, java.util.regex.Matcher.quoteReplacement(replacement))
                }
                if (newSecModified) {
                    newSecMatcher.appendTail(newSecSb)
                    content = newSecSb.toString()
                }

                if (modified || superModified || newSecModified) {
                    file.write(content, "UTF-8")
                }
            }
        }
    }
}

compileJava {
    if (!skipBuiltinProtection) {
        dependsOn obfuscateStrings
        source = fileTree("build/obfuscatedSrc")
    } else {
        source = fileTree("src/main/java")
    }
}

task encryptClasses {
    dependsOn compileJava
    doLast {
        def classesToEncrypt = [
            'me/shedaniel/clothconfig2/internal/secure/Watermark'
        ]
        
        def buildDir = file("build/classes/java/main")
        def outDir = file("build/resources/main/assets/clothconfig2/data")
        outDir.mkdirs()

        // Generate a random build-time key (in a real scenario this matches the ECDH derived key or is wrapped by it, 
        // but for this build we'll use a hardcoded dev key for the JSON generation, then the client derives the same key)
        // Since the prompt asks for AES-GCM class encryption task, we'll implement the encryption here.
        def devKey = "dragonite-session-key".getBytes("UTF-8")
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        def aesKeyBytes = digest.digest(devKey)
        def secretKey = new javax.crypto.spec.SecretKeySpec(aesKeyBytes, "AES")

        classesToEncrypt.each { className ->
            def classFile = file("${buildDir}/${className}.class")
            if (classFile.exists()) {
                def classBytes = classFile.bytes
                
                // Encrypt
                def cipher = javax.crypto.Cipher.getInstance("AES/GCM/NoPadding")
                def iv = new byte[12]
                new java.security.SecureRandom().nextBytes(iv)
                def spec = new javax.crypto.spec.GCMParameterSpec(128, iv)
                cipher.init(javax.crypto.Cipher.ENCRYPT_MODE, secretKey, spec)
                
                def encrypted = cipher.doFinal(classBytes)
                def b64Data = java.util.Base64.getEncoder().encodeToString(encrypted)
                def b64Iv = java.util.Base64.getEncoder().encodeToString(iv)
                
                // Write JSON
                def jsonName = className.replace('/', '_') + ".json"
                def jsonFile = file("${outDir}/${jsonName}")
                jsonFile.text = "{\"version\":\"1.0\",\"iv\":\"${b64Iv}\",\"data\":\"${b64Data}\"}"
                
                // Stub the original class so it isn't in the jar, but we must use a valid empty class
                // so that Fabric Loom's remapJar doesn't crash on invalid class structure.
                // We'll write a minimal class using standard classfile bytes.
                
                // Magic, minor, major (Java 8)
                def magicAndVersion = [0xCA, 0xFE, 0xBA, 0xBE, 0x00, 0x00, 0x00, 0x34]
                // CP count: 8
                def cpCount = [0x00, 0x08]
                // CP[1] = Class (CP[2])
                def cp1 = [0x07, 0x00, 0x02]
                // CP[2] = Utf8 (className)
                def utfName = className.getBytes("UTF-8")
                def cp2 = [0x01, (utfName.length >> 8) & 0xFF, utfName.length & 0xFF]
                cp2.addAll(utfName.toList())
                // CP[3] = Class (CP[4])
                def cp3 = [0x07, 0x00, 0x04]
                // CP[4] = Utf8 ("java/lang/Object")
                def objUtf = "java/lang/Object".getBytes("UTF-8")
                def cp4 = [0x01, (objUtf.length >> 8) & 0xFF, objUtf.length & 0xFF]
                cp4.addAll(objUtf.toList())
                // CP[5] = Utf8 ("<init>")
                def initUtf = "<init>".getBytes("UTF-8")
                def cp5 = [0x01, (initUtf.length >> 8) & 0xFF, initUtf.length & 0xFF]
                cp5.addAll(initUtf.toList())
                // CP[6] = Utf8 ("()V")
                def initDesc = "()V".getBytes("UTF-8")
                def cp6 = [0x01, (initDesc.length >> 8) & 0xFF, initDesc.length & 0xFF]
                cp6.addAll(initDesc.toList())
                // CP[7] = Utf8 ("Code")
                def codeUtf = "Code".getBytes("UTF-8")
                def cp7 = [0x01, (codeUtf.length >> 8) & 0xFF, codeUtf.length & 0xFF]
                cp7.addAll(codeUtf.toList())
                
                def stubClassBytes = []
                stubClassBytes.addAll(magicAndVersion)
                stubClassBytes.addAll(cpCount)
                stubClassBytes.addAll(cp1)
                stubClassBytes.addAll(cp2)
                stubClassBytes.addAll(cp3)
                stubClassBytes.addAll(cp4)
                stubClassBytes.addAll(cp5)
                stubClassBytes.addAll(cp6)
                stubClassBytes.addAll(cp7)
                
                // access_flags: ACC_PUBLIC | ACC_SUPER
                stubClassBytes.addAll([0x00, 0x21])
                // this_class: 1
                stubClassBytes.addAll([0x00, 0x01])
                // super_class: 3
                stubClassBytes.addAll([0x00, 0x03])
                // interfaces_count: 0
                stubClassBytes.addAll([0x00, 0x00])
                // fields_count: 0
                stubClassBytes.addAll([0x00, 0x00])
                // methods_count: 0
                stubClassBytes.addAll([0x00, 0x00])
                // attributes_count: 0
                stubClassBytes.addAll([0x00, 0x00])
                
                def byteArr = new byte[stubClassBytes.size()]
                for (int i = 0; i < stubClassBytes.size(); i++) {
                    byteArr[i] = stubClassBytes[i].byteValue()
                }
                
                classFile.bytes = byteArr
                println "Encrypted ${className} -> ${jsonName} (stubbed)"
            }
        }
    }
}

processResources {
    if (!skipBuiltinProtection && enableExperimentalClassEncryption) {
        dependsOn encryptClasses
    }
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

task copyObfuscatorDependencies(type: Copy) {
    from configurations.compileClasspath
    from configurations.runtimeClasspath
    into "$buildDir/obfuscation_deps"
    exclude { details ->
        details.file.name.toLowerCase().contains("cloth-config") ||
        details.file.name.toLowerCase().contains("minecraft-merged")
    }
}
