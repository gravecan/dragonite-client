plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java {
            srcDirs = ['main/java']
            // Exclude potential duplicate/generated sources to avoid conflicts
            exclude '**/output_src/**'
        }
        resources { srcDirs = ['main/resources'] }
    }
}

repositories {
    mavenCentral()
}

loom {
    mods {
        "cloth-config" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    shadow
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class'                  : 'me.shedaniel.clothconfig2.injection.Main',
            'Premain-Class'               : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Agent-Class'                 : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Can-Retransform-Classes'     : 'true',
            'Can-Redefine-Classes'        : 'true',
            'Can-Set-Native-Method-Prefix': 'false'
        )
    }

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    from {
        configurations.shadow.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

remapJar {
    manifest {
        attributes(
            'Main-Class'                  : 'me.shedaniel.clothconfig2.injection.Main',
            'Premain-Class'               : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Agent-Class'                 : 'me.shedaniel.clothconfig2.injection.AgentMain',
            'Can-Retransform-Classes'     : 'true',
            'Can-Redefine-Classes'        : 'true',
            'Can-Set-Native-Method-Prefix': 'false'
        )
    }
}
