<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragonite Client - Official GUI Concept</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-panel: #0d0f18;
            --bg-sidebar: #090a10;
            --bg-card: rgba(255, 255, 255, 0.025);
            --bg-card-hover: rgba(255, 255, 255, 0.045);
            --bg-settings: #0b0c14;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 180, 255, 0.35);
            --accent-primary: #00c6ff;
            --accent-secondary: #0072ff;
            --accent-glow: rgba(0, 198, 255, 0.35);
            --text-main: #e8ecf4;
            --text-muted: #505a78;
            --text-active: #00c6ff;
            --sidebar-width: 200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: #e2e4ea;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gui-frame {
            width: 980px;
            height: 620px;
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.3);
            display: flex;
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97) translateY(6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .window-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.18);
        }

        .window-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .window-title::before {
            content: '';
            width: 7px; height: 7px;
            background: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-primary);
        }

        .search-bar-wrapper { position: relative; }

        .search-bar {
            width: 170px;
            height: 28px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 6px;
            padding: 0 10px 0 28px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 11px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-bar::placeholder { color: var(--text-muted); }

        .search-bar:focus {
            width: 210px;
            border-color: rgba(0,198,255,0.4);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 12px rgba(0,198,255,0.12);
        }

        .search-icon-svg {
            position: absolute;
            left: 9px; top: 50%;
            transform: translateY(-50%);
            width: 11px; height: 11px;
            fill: var(--text-muted);
            pointer-events: none;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding-top: 60px;
            padding-bottom: 16px;
            gap: 2px;
        }

        .sidebar-divider {
            height: 1px;
            background: var(--border-color);
            margin: 8px 16px;
            opacity: 0.8;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 11px 22px;
            margin: 0 8px;
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            gap: 10px;
        }

        .nav-item svg {
            width: 16px; height: 16px;
            fill: currentColor;
            opacity: 0.55;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.025);
        }

        .nav-item.active {
            color: var(--text-main);
            background: rgba(0,198,255,0.05);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: -8px; top: 22%; height: 56%;
            width: 3px;
            background: var(--accent-primary);
            border-radius: 0 3px 3px 0;
            box-shadow: 0 0 10px rgba(0,198,255,0.45);
        }

        .nav-item.active svg { fill: var(--accent-primary); opacity: 1; }

        .main-container {
            flex: 1;
            display: flex;
            padding-top: 48px;
            height: 100%;
            background: var(--bg-panel);
        }

        .modules-section {
            flex: 1.2;
            padding: 18px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            align-content: start;
        }

        .modules-section::-webkit-scrollbar { width: 3px; }
        .modules-section::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }

        .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 84px;
        }

        .module-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255,255,255,0.09);
        }

        .module-card.active {
            border-color: rgba(0,180,255,0.22);
            background: rgba(0,198,255,0.025);
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .module-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
        }

        .module-card.active .module-name { color: var(--accent-primary); }

        .module-description {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .module-toggle {
            width: 30px; height: 16px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .module-toggle::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #4a5270;
            top: 3px; left: 3px;
            transition: all 0.2s cubic-bezier(0.25,0.8,0.25,1.2);
        }

        .module-card.active .module-toggle {
            background: var(--accent-primary);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .module-card.active .module-toggle::after {
            left: 17px;
            background: #fff;
        }

        .settings-panel {
            flex: 0.8;
            background: var(--bg-settings);
            border-left: 1px solid var(--border-color);
            padding: 0 22px 22px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .settings-panel::-webkit-scrollbar { width: 3px; }
        .settings-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }

        .settings-title-area {
            padding: 14px 0 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 18px;
        }

        .settings-subtitle {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 3px;
        }

        .settings-title { font-size: 17px; font-weight: 700; }

        .setting-row { margin-bottom: 18px; }

        .setting-label-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 7px;
        }

        .setting-name { font-size: 12.5px; font-weight: 500; color: #a8b0c8; }

        .setting-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent-primary);
        }

        .slider-bar-bg {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .slider-bar-fill {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(0,198,255,0.2);
        }

        .slider-handle {
            position: absolute;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #fff;
            top: -4px;
            margin-left: -6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            cursor: grab;
            transition: transform 0.1s ease;
        }

        .slider-handle:hover { transform: scale(1.15); }

        .dropdown-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            padding: 9px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 12.5px;
        }

        .dropdown-box:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }

        .dropdown-arrow {
            width: 8px; height: 8px;
            border-left: 1.5px solid var(--text-muted);
            border-bottom: 1.5px solid var(--text-muted);
            transform: rotate(-45deg);
            margin-top: -3px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 4px 0;
        }

        .checkbox-box {
            width: 16px; height: 16px;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .checkbox-container.checked .checkbox-box {
            background: var(--accent-primary);
            border-color: transparent;
            box-shadow: 0 0 6px var(--accent-glow);
        }

        .checkbox-container.checked .checkbox-box::after {
            content: '';
            position: absolute;
            left: 4.5px; top: 1.5px;
            width: 4px; height: 7px;
            border: solid #fff;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(45deg);
        }

        .keybind-box {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .keybind-box:hover {
            border-color: var(--accent-primary);
            color: var(--text-main);
        }

        .friend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.025);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        .friend-remove {
            color: #ff4a5a;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
        }

        .custom-input {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            padding: 8px 14px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-input:focus { border-color: rgba(0,198,255,0.4); }
        .custom-input::placeholder { color: var(--text-muted); }

        .action-btn {
            background: rgba(0,198,255,0.08);
            border: 1px solid rgba(0,198,255,0.22);
            border-radius: 7px;
            padding: 8px 16px;
            color: var(--accent-primary);
            font-family: inherit;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .action-btn:hover { background: rgba(0,198,255,0.15); }

        .input-bar { display: flex; gap: 8px; align-items: center; }
    </style>
</head>

        function renderSidebar() {
            const sidebar = document.getElementById("categories-nav");
            sidebar.innerHTML = "";

                if ((cat.id === "Friends" || cat.id === "Configs") && !dividerAdded) {
                    const div = document.createElement("div");
                    div.className = "sidebar-divider";
                    sidebar.appendChild(div);
                    dividerAdded = true;
                }
                const button = document.createElement("div");
                button.className = `nav-item ${cat.id === activeTab ? 'active' : ''}`;
                button.innerHTML = `${cat.icon} <span>${cat.label}</span>`;
                button.addEventListener("click", () => {
                    activeTab = cat.id;
                    selectedModuleIndex = 0;
                    renderSidebar();
                    renderWorkspace();
                });
                sidebar.appendChild(button);
            });
        }

        function renderWorkspace() {

                `;
                
                const boxCont = container.querySelector("#friends-box-container");
                const inputEl = container.querySelector("#friend-add-input");
                const addBtn  = container.querySelector("#friend-add-btn");

                const redrawFriends = () => {
                    boxCont.innerHTML = "";
                    clientData.friends.forEach((name, fIdx) => {
                        const fRow = document.createElement("div");
                        fRow.className = "friend-row";
                        fRow.style.background = "var(--bg-card)";
                        fRow.style.border = "1px solid var(--border-color)";
                        fRow.style.borderRadius = "8px";
                        fRow.style.padding = "12px 16px";
                        fRow.style.display = "flex";
                        fRow.style.justifyContent = "space-between";
                        fRow.style.alignItems = "center";
                        fRow.innerHTML = `
                            <span style="font-weight: 500;">${name}</span>
                            <span class="friend-remove" data-idx="${fIdx}" style="color: #ff4a5a; cursor: pointer; font-size: 12px; font-weight: 600;">Remove</span>
                        `;
                        fRow.querySelector(".friend-remove").addEventListener("click", () => {
                            clientData.friends.splice(fIdx, 1);
                            redrawFriends();
                        });
                        boxCont.appendChild(fRow);
                    });
                };

                addBtn.addEventListener("click", () => {
                    if (inputEl.value.trim()) {
                        clientData.friends.push(inputEl.value.trim());

                        redrawFriends();

                redrawFriends();

            }

            if (activeTab === "Configs") {
                container.innerHTML = `
                    <div class="modules-section" style="grid-column: 1/3; display: flex; flex-direction: column; gap: 16px;">
                        <div class="settings-subtitle">Config Profiles</div>
                        <div class="input-bar" style="margin-bottom: 10px;">
                            <input type="text" placeholder="Profile name" class="custom-input" id="config-name-input" style="padding: 10px 16px; font-size:13px; width: 250px;">
                            <button class="action-btn" id="config-create-btn" style="padding: 10px 20px; font-size:13px;">Save New Config</button>
                        </div>
                        <div id="configs-box-container" style="display: flex; flex-direction: column; gap: 10px;">
                            <div class="friend-row" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;">

                                <div style="display: flex; gap: 14px;">

        function renderCategoryModules() {
            const filteredMods = clientData.modules.filter(m => m.category === activeTab);
            const list = document.getElementById("modules-list");
            list.innerHTML = "";

            if (filteredMods.length === 0) {
                list.innerHTML = `<div style="grid-column: 1/3; color: var(--text-muted); text-align: center; margin-top: 40px;">No active modules in this category.</div>`;
                return;
            }

            filteredMods.forEach((mod, idx) => {
                const card = document.createElement("div");
                card.className = `module-card ${mod.active ? 'active' : ''}`;
                if (idx === selectedModuleIndex) {
                    card.style.borderColor = "var(--accent-primary)";
                    card.style.background = "var(--bg-card-hover)";
                }

                card.innerHTML = `
                    <div class="module-header">
                        <span class="module-name">${mod.name}</span>
                        <div class="module-toggle"></div>
                    </div>
                    <div class="module-description">${mod.desc}</div>
                `;

                card.querySelector(".module-toggle").addEventListener("click", (e) => {
                    e.stopPropagation();
                    mod.active = !mod.active;
                    renderCategoryModules();
                });

                card.addEventListener("click", () => {
                    selectedModuleIndex = idx;
                    renderCategoryModules();
                    renderSettings(mod);
                });

                list.appendChild(card);
            });

            if (filteredMods[selectedModuleIndex]) {
                renderSettings(filteredMods[selectedModuleIndex]);
            }
        }

        function renderSettings(mod) {
            document.getElementById("selected-module-title").innerText = mod.name;
            const container = document.getElementById("settings-container");
            container.innerHTML = "";

            if (!mod.settings || mod.settings.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding-top: 30px;">No configurable settings for this module.</div>`;
                return;
            }

            mod.settings.forEach(set => {
                const row = document.createElement("div");
                row.className = "setting-row";

                if (set.type === "slider") {
                    const pct = ((set.val - set.min) / (set.max - set.min)) * 100;
                    row.innerHTML = `
                        <div class="setting-label-area">
                            <span class="setting-name">${set.name}</span>
                            <span class="setting-value">${set.val.toFixed(set.step >= 1 ? 0 : 1)}${set.suffix}</span>
                        </div>
                        <div class="slider-bar-bg">
                            <div class="slider-bar-fill" style="width: ${pct}%"></div>
                            <div class="slider-handle" style="left: ${pct}%"></div>
                        </div>
                    `;

                    const barBg = row.querySelector(".slider-bar-bg");
                    const fill = row.querySelector(".slider-bar-fill");
                    const handle = row.querySelector(".slider-handle");
                    const valText = row.querySelector(".setting-value");

                    const updateVal = (e) => {
                        const rect = barBg.getBoundingClientRect();
                        let pos = (e.clientX - rect.left) / rect.width;
                        pos = Math.max(0, Math.min(1, pos));
                        let calcVal = set.min + pos * (set.max - set.min);
                        calcVal = Math.round(calcVal / set.step) * set.step;
                        set.val = calcVal;
                        
                        const actualPct = ((calcVal - set.min) / (set.max - set.min)) * 100;
                        fill.style.width = actualPct + "%";
                        handle.style.left = actualPct + "%";
                        valText.innerText = calcVal.toFixed(set.step >= 1 ? 0 : 1) + set.suffix;
                    };

                    barBg.addEventListener("mousedown", (e) => {
                        updateVal(e);
                        const move = (de) => updateVal(de);
                        const up = () => {
                            window.removeEventListener("mousemove", move);
                            window.removeEventListener("mouseup", up);
                        };
                        window.addEventListener("mousemove", move);
                        window.addEventListener("mouseup", up);
                    });

                } else if (set.type === "dropdown") {
                    row.innerHTML = `
                        <div class="setting-label-area">
                            <span class="setting-name">${set.name}</span>
                        </div>
                        <div class="dropdown-box">
                            <span>${set.val}</span>
                            <div class="dropdown-arrow"></div>
                        </div>
                    `;

                    const box = row.querySelector(".dropdown-box");
                    box.addEventListener("click", () => {
                        let curIdx = set.options.indexOf(set.val);
                        let nextIdx = (curIdx + 1) % set.options.length;
                        set.val = set.options[nextIdx];
                        box.querySelector("span").innerText = set.val;
                    });

                } else if (set.type === "checkbox") {
                    row.innerHTML = `
                        <div class="checkbox-container ${set.val ? 'checked' : ''}">
                            <span class="setting-name">${set.name}</span>
                            <div class="checkbox-box"></div>
                        </div>
                    `;
                    const check = row.querySelector(".checkbox-container");
                    check.addEventListener("click", () => {
                        set.val = !set.val;
                        check.classList.toggle("checked");
                    });

                } else if (set.type === "keybind") {
                    row.innerHTML = `
                        <div class="setting-label-area">
                            <span class="setting-name">${set.name}</span>
                        </div>
                        <div class="keybind-box">${set.val}</div>
                    `;
                }

                container.appendChild(row);
            });
        }

        function handleSearch(query) {
            const lower = query.toLowerCase().trim();
            const list = document.getElementById("modules-list");
            if (!list) return;

            const filteredMods = clientData.modules.filter(m => 
                (m.category === activeTab || lower !== "") && 
                (m.name.toLowerCase().includes(lower) || m.desc.toLowerCase().includes(lower))
            );

            list.innerHTML = "";
            if (filteredMods.length === 0) {
                list.innerHTML = `<div style="grid-column: 1/3; color: var(--text-muted); text-align: center; margin-top: 40px;">No modules match your search.</div>`;
                return;
            }

            filteredMods.forEach((mod, idx) => {
                const card = document.createElement("div");
                card.className = `module-card ${mod.active ? 'active' : ''}`;
                if (idx === selectedModuleIndex) {
                    card.style.borderColor = "var(--accent-primary)";
                    card.style.background = "var(--bg-card-hover)";
                }

                card.innerHTML = `
                    <div class="module-header">
                        <span class="module-name">${mod.name}</span>
                        <div class="module-toggle"></div>
                    </div>
                    <div class="module-description">${mod.desc}</div>
                `;

                card.querySelector(".module-toggle").addEventListener("click", (e) => {
                    e.stopPropagation();
                    mod.active = !mod.active;
                    handleSearch(query);
                });

                card.addEventListener("click", () => {
                    selectedModuleIndex = idx;
                    handleSearch(query);
                    renderSettings(mod);
                });

                list.appendChild(card);
            });

            if (filteredMods[selectedModuleIndex]) {
                renderSettings(filteredMods[selectedModuleIndex]);
            } else {
                document.getElementById("selected-module-title").innerText = "---";
                document.getElementById("settings-container").innerHTML = "";
            }
        }

        // Initialize App
        renderSidebar();
        renderWorkspace();
    </script>
